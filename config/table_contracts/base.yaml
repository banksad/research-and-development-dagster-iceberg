version: 1
contracts:
  - identifier: raw.full_responses
    namespace: raw
    table: full_responses
    description: Raw full survey response records as landed input.
    layer: raw
    owner: randd-data-platform
    expected_grain: reference + instance + survey_year + survey_type
    primary_key: null
    partition_by: [survey_year, survey_type]
    required_columns: [survey_year, survey_type, reference, instance]
    notes:
      - "TODO: Confirm complete key and schema with staging extraction contract."

  - identifier: raw.backdata
    namespace: raw
    table: backdata
    description: Historic backdata input records used for longitudinal processing.
    layer: raw
