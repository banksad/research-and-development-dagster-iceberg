    expected_grain: reference + instance + survey_year + survey_type
    primary_key: null
    partition_by: [survey_year, survey_type]
    required_columns: [survey_year, survey_type, reference, instance]
    notes:
      - "TODO: Clarify source system lineage and historical key semantics."

  - identifier: raw.manual_outliers
    namespace: raw
    table: manual_outliers
    description: Manual outlier directives provided as input.
    layer: raw
    owner: randd-methodology
    expected_grain: correction row per subject variable/context
    primary_key: null
    partition_by: [survey_year, survey_type]
    required_columns: [survey_year, survey_type, reference]
    notes:
      - "TODO: Confirm directive field set required by outlier stage logic."

  - identifier: raw.manual_trimming
