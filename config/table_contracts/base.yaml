    required_columns: [survey_year, survey_type, reference]
    notes:
      - "TODO: Confirm trimming contract with outlier methodology owners."

  - identifier: ref.ultfoc_mapper
    namespace: ref
    table: ultfoc_mapper
    description: Foreign ownership reference mapper from response reference to ownership code.
    layer: ref
    owner: randd-reference-data
    expected_grain: one row per ruref
    primary_key: ruref
    partition_by: []
    required_columns: [ruref, ultfoc]
    notes:
      - "Used by the first clean mapping seam for foreign ownership mapping."
      - "Tiny synthetic fixtures use this contract; production reference-data loading is not implemented here."

  - identifier: ref.postcode_mapper
    namespace: ref
    table: postcode_mapper
    description: Reference mapping from postcode to analytical geography attributes.
    layer: ref
    owner: randd-reference-data
    expected_grain: one row per postcode
    primary_key: postcode
    partition_by: []
    required_columns: [postcode]
    notes:
      - "TODO: Add required destination geography columns once standardised."

  - identifier: ref.pg_detailed_mapper
    namespace: ref
    table: pg_detailed_mapper
    description: Detailed product-group reference mappings.
    layer: ref
    owner: randd-reference-data
    expected_grain: one row per product group code
    primary_key: null
    partition_by: []
    required_columns: [pg_code]
    notes:
      - "TODO: Confirm canonical code column naming and uniqueness assumptions."

  - identifier: ref.sic_division_detailed_mapper
    namespace: ref
    table: sic_division_detailed_mapper
    description: SIC division to detailed analytical mapping reference.
    layer: ref
    owner: randd-reference-data
    expected_grain: one row per SIC division code
    primary_key: null
    partition_by: []
    required_columns: [sic_division]
    notes:
      - "TODO: Confirm SIC key naming and expanded reference fields."

  - identifier: ops.response_corrections
    namespace: ops
    table: response_corrections
    description: Explicit auditable response-value corrections applied as controlled input.
    layer: ops
    owner: randd-operations
    expected_grain: one correction event per variable and response record
    primary_key: correction_id
    partition_by: [survey_year, survey_type]
    required_columns:
      - correction_id
      - survey_year
      - survey_type
      - reference
      - instance
      - variable
      - old_value
      - new_value
      - reason
      - source
      - approved_by
      - approved_at
      - created_at
    notes:
      - "Replaces legacy hidden construction mutation with explicit auditable input records."
      - "Corrections must be attributable and approval-traceable."

  - identifier: ops.postcode_corrections
    namespace: ops
    table: postcode_corrections
    description: Explicit auditable postcode corrections applied as controlled input.
    layer: ops
    owner: randd-operations
    expected_grain: one postcode correction event per response record
    primary_key: correction_id
    partition_by: [survey_year, survey_type]
    required_columns:
      - correction_id
      - survey_year
      - survey_type
      - reference
      - instance
      - old_postcode
      - new_postcode
      - reason
      - source
      - approved_by
      - approved_at
      - created_at
    notes:
      - "Replaces legacy hidden construction mutation with explicit auditable input records."
      - "Postcode amendments are governed operational inputs, not hidden runtime mutation."

